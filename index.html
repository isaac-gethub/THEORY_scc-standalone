<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SAP Controls &amp; Compliance | TIB Systems Inc.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="scc-auth-guard.js"></script>
<style>
  :root{
    --navy:#1F3864; --navy-light:#2E4B7A; --teal:#1F7A8C; --teal-light:#5BB5C6;
    --panel:#EBF2F7; --border:#DDE4EC; --muted:#7A8AA8; --success:#43A047; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--panel);color:#16233D;}
  header{background:var(--navy);color:var(--white);padding:28px 24px;}
  header h1{margin:0 0 4px;font-size:1.5rem;}
  header p{margin:0;color:rgba(255,255,255,0.75);font-size:0.92rem;}
  main{max-width:920px;margin:0 auto;padding:28px 20px 60px;}
  .progress-summary{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:18px 22px;margin-bottom:22px;display:flex;align-items:center;gap:18px;}
  .progress-summary .ring{flex-shrink:0;font-weight:700;color:var(--navy);font-size:1.3rem;}
  .progress-summary .bar{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden;}
  .progress-summary .bar > div{height:100%;background:var(--teal);border-radius:4px;transition:width .3s;}
  .progress-summary .label{font-size:0.85rem;color:var(--muted);}
  .module-list{display:flex;flex-direction:column;gap:10px;}
  .module-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px 18px;display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;transition:box-shadow .15s,border-color .15s;}
  .module-card:hover{box-shadow:0 2px 10px rgba(31,56,100,0.10);border-color:var(--teal-light);}
  .module-card .num{width:38px;height:38px;flex-shrink:0;border-radius:50%;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy);font-size:0.9rem;}
  .module-card.done .num{background:var(--success);border-color:var(--success);color:var(--white);}
  .module-card .info{flex:1;min-width:0;}
  .module-card .info h3{margin:0 0 2px;font-size:1rem;}
  .module-card .info p{margin:0;font-size:0.85rem;color:var(--muted);}
  .module-card .status{font-size:0.8rem;font-weight:600;color:var(--muted);white-space:nowrap;}
  .module-card.done .status{color:var(--success);}
</style>
</head>
<body>

<header>
  <h1>SAP Controls &amp; Compliance</h1>
  <p>Optional elective &middot; TIB-TRN-ELECTIVE-SCC-001</p>
</header>

<main>

  <div class="progress-summary">
    <div class="ring" id="progress-pct">0%</div>
    <div style="flex:1;">
      <div class="bar"><div id="progress-fill" style="width:0%;"></div></div>
      <div class="label" id="progress-label">0 of 10 modules complete</div>
    </div>
  </div>
  <a class="module-card" id="foundations-card" href="./b0.html" style="border-left:4px solid var(--teal);margin-bottom:16px;">
    <div class="num" style="background:var(--panel);border-color:var(--border);">&#9733;</div>
    <div class="info">
      <h3>Primary Goals of SAP Controls &amp; Compliance</h3>
      <p>Foundational reading &mdash; read this before starting B1.</p>
    </div>
    <div class="status" id="foundations-status">Not read</div>
  </a>
  <div class="module-list" id="module-list"></div>

</main>

<script>
(async function () {
  // By the time this runs, scc-auth-guard.js has already confirmed a valid,
  // enrolled session and set window.__sccSb / window.__sccUserEmail --
  // this page only has to render.

  const MODULES = [
    { code: 'b1',  title: 'Risk Types',              blurb: 'Foundational risk categories in an SAP environment.' },
    { code: 'b2',  title: 'Control Types',            blurb: 'Preventive, detective, and corrective controls.' },
    { code: 'b3',  title: 'Control Nature',           blurb: 'Manual, automated, and IT-dependent manual controls.' },
    { code: 'b4',  title: 'Why Controls Matter',      blurb: 'The business case for controls, in plain terms.' },
    { code: 'b5',  title: 'Engagement Types',         blurb: 'How QA, advisory, and audit engagements differ.' },
    { code: 'b6',  title: 'S/4HANA Lifecycle',        blurb: 'Where controls fit across the implementation lifecycle.' },
    { code: 'b7',  title: 'Reading FD Documents',     blurb: 'Making sense of functional design documentation.' },
    { code: 'b8',  title: 'Testing Phase',            blurb: 'Planning and executing control testing.' },
    { code: 'b9',  title: 'AI in Controls',           blurb: 'Where AI helps -- and where it still needs a human.' },
    { code: 'b10', title: 'Practitioner Capstone',    blurb: 'Pulling the whole programme together.' },
  ];

  function render() {
    const email = window.__sccUserEmail;
    const sb = window.__sccSb;
    if (!email || !sb) {
      // Guard hasn't finished yet -- try again shortly.
      setTimeout(render, 100);
      return;
    }
    load(sb, email);
  }

  async function load(sb, email) {
    let doneSet = new Set();
    try {
      const { data, error } = await sb
        .from('sapexec_scc_progress')
        .select('module_id')
        .eq('email', email);
      if (!error && data) doneSet = new Set(data.map(r => r.module_id));
    } catch (e) {
      console.warn('Could not load progress', e);
    }

    if (doneSet.has('b0')) {
      document.getElementById('foundations-status').textContent = 'Read';
      document.getElementById('foundations-status').style.color = 'var(--success)';
      document.getElementById('foundations-card').classList.add('done');
    }

    const pct = Math.round((doneSet.size / MODULES.length) * 100);
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-label').textContent =
      doneSet.size + ' of ' + MODULES.length + ' modules complete';

    const list = document.getElementById('module-list');
    MODULES.forEach((m, i) => {
      const done = doneSet.has(m.code);
      const a = document.createElement('a');
      a.className = 'module-card' + (done ? ' done' : '');
      a.href = './' + m.code + '.html';
      a.innerHTML =
        '<div class="num">' + (done ? '\u2713' : (i + 1)) + '</div>' +
        '<div class="info"><h3>' + m.code.toUpperCase() + ' \u2014 ' + m.title + '</h3>' +
        '<p>' + m.blurb + '</p></div>' +
        '<div class="status">' + (done ? 'Complete' : 'Not started') + '</div>';
      list.appendChild(a);
    });
  }

  render();
})();
</script>
</body>
</html>
